name: Generate Python dependency locks
on:
  pull_request:
    paths:
      - 'requirements.in'
      - 'requirements-dev.in'
      - '.github/workflows/generate-lockfiles.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned resolver
        run: python -m pip install uv==0.10.0
      - name: Compile production lock (Python 3.12)
        run: uv pip compile requirements.in --python-version 3.12 --exclude-newer '2026-10-29T18:00:00Z' --output-file requirements.txt
      - name: Compile development lock using production constraints
        run: uv pip compile requirements-dev.in --python-version 3.12 --exclude-newer '2026-10-29T18:00:00Z' --constraint requirements.txt --output-file requirements-dev.txt
      - name: Validate resolved dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
          python -m pytest -q
      - name: Print generated lock files for repository commit
        run: |
          echo '===SHIFT101_PROD_LOCK_START==='
          cat requirements.txt
          echo '===SHIFT101_PROD_LOCK_END==='
          echo '===SHIFT101_DEV_LOCK_START==='
          cat requirements-dev.txt
          echo '===SHIFT101_DEV_LOCK_END==='
