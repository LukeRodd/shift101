name: Deploy Shift101 to AWS (manual)
on:
  workflow_dispatch:
    inputs:
      acknowledge_charges:
        description: 'I authorize AWS resource creation and possible charges'
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: shift101-aws-demo
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.acknowledge_charges == true }}
    name: Publish synthetic demo to AWS
    runs-on: ubuntu-latest
    environment: aws-demo
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_EXPECTED_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_BUDGET_NAME: ${{ vars.AWS_BUDGET_NAME }}
      DEPLOY_ACKNOWLEDGE_CHARGES: 'YES'
      SAM_CLI_TELEMETRY: '0'
    steps:
      - name: Verify deployment variables are set
        shell: bash
        run: |
          set -eu
          test -n "$AWS_ROLE_ARN" || { echo 'Missing AWS_DEPLOY_ROLE_ARN'; exit 1; }
          test -n "$AWS_REGION" || { echo 'Missing AWS_REGION'; exit 1; }
          test -n "$AWS_EXPECTED_ACCOUNT_ID" || { echo 'Missing AWS_ACCOUNT_ID'; exit 1; }
          test -n "$AWS_BUDGET_NAME" || { echo 'Missing AWS_BUDGET_NAME'; exit 1; }
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install AWS SAM CLI
        uses: aws-actions/setup-sam@v3
      - name: Install CloudFormation linter
        run: python -m pip install 'cfn-lint>=1,<2'
      - name: Configure short-lived AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: shift101-demo-deploy
      - name: Publish and smoke-test (Bedrock disabled)
        shell: bash
        run: bash deploy/aws/deploy.sh
